<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>omo-switcher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="statusbar">
    <span class="brand">omo-switcher</span>
    <button id="settingsBtn" class="settings-btn" title="设置">⚙</button>
  </header>

  <main>
    <section class="tabs-section">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="workspace">本地工作区</button>
        <button class="tab-btn" data-tab="local">本地存储区</button>
        <button class="tab-btn" data-tab="remote">远程存储区</button>
      </div>

      <div class="tab-panel active" id="tab-workspace">
        <section class="card">
          <div class="zone-head">
            <h2>工作目录 zip 区</h2>
            <span id="workspaceCount" class="pill pill-muted">0 项</span>
          </div>
          <div id="workspacePath" class="pathline mono">opencodeDir: ?</div>
          <div class="row">
            <label>当前档位</label>
            <select id="tierSelect"></select>
            <button id="applyTier">应用到工作目录</button>
          </div>
          <div class="row">
            <button id="downloadWorkspace" class="secondary">下载选中到 SQLite</button>
            <button id="restartBtn" class="danger">重启 Desktop</button>
          </div>
          <table id="workspaceTable"><thead><tr><th></th><th>zip 档位包</th><th>sha</th></tr></thead><tbody></tbody></table>
          <div id="switchLog" class="log"></div>
          <div id="restartLog" class="log"></div>
        </section>
      </div>

      <div class="tab-panel" id="tab-local">
        <section class="card">
          <div class="zone-head">
            <h2>本地 SQLite zip 仓库</h2>
            <span id="localCount" class="pill pill-muted">0 项</span>
          </div>
          <div class="row">
            <button id="uploadWorkspace" class="secondary">上传选中到工作目录</button>
            <button id="pushRedis" class="secondary">上传选中到 Redis</button>
          </div>
          <table id="localTable"><thead><tr><th></th><th>zip 档位包</th><th>sha</th></tr></thead><tbody></tbody></table>
          <div id="localLog" class="log"></div>
        </section>
      </div>

      <div class="tab-panel" id="tab-remote">
        <section class="card">
          <h2>远端服务器</h2>
          <div class="row">
            <label>同步地址</label>
            <input id="serverUrl" type="text" placeholder="http://127.0.0.1:7600" />
            <button id="testConn">连接</button>
          </div>
          <p class="hint">该地址属于本机私有设置，<b>不参与同步、不会被覆盖</b>。</p>
          <hr />
          <div class="zone-head">
            <h2>Redis zip 仓库</h2>
            <span id="remoteCount" class="pill pill-muted">0 项</span>
          </div>
          <div class="row">
            <label>Redis 版本</label>
            <select id="snapSelect"><option value="">最新(head)</option></select>
          </div>
          <div class="row">
            <button id="pullRedis" class="secondary">下载选中到 SQLite</button>
            <button id="reloadSync" class="secondary">刷新三层</button>
          </div>
          <table id="remoteTable"><thead><tr><th></th><th>zip 档位包</th><th>sha</th></tr></thead><tbody></tbody></table>
          <div id="diffLegend" class="hint"></div>
        </section>
      </div>
    </section>

    <!-- 历史版本 -->
    <section class="card">
      <h2>远端历史版本</h2>
      <button id="reloadSnaps" class="secondary">刷新历史</button>
      <table id="snapTable"><thead><tr><th>时间</th><th>id</th><th>备注</th><th>文件数</th><th>操作</th></tr></thead><tbody></tbody></table>
      <div id="snapDetail"></div>
    </section>
  </main>

  <!-- 设置弹窗 -->
  <dialog id="settingsDlg">
    <h3>设置</h3>
    <div class="settings-row">
      <label>颜色主题</label>
      <select id="themeSelect">
        <option value="system">跟随系统</option>
        <option value="light">明亮</option>
        <option value="dark">暗黑</option>
      </select>
    </div>
    <div class="row right">
      <button id="settingsClose" class="secondary">关闭</button>
    </div>
  </dialog>

  <!-- 确认弹窗 -->
  <dialog id="confirmDlg">
    <h3 id="confirmTitle">确认同步</h3>
    <div id="confirmBody" class="log"></div>
    <div class="row right">
      <button id="confirmCancel" class="secondary">取消</button>
      <button id="confirmOk" class="danger">确认执行</button>
    </div>
  </dialog>

  <script src="renderer.js"></script>
</body>
</html>
